# ============================================================
# inventories/hosts.ini — STATIC INVENTORY
# TOPIC COVERED: Inventory — static, groups, group children
# ============================================================

# ── Tier 1: Web / Load Balancer Servers ──
[webservers]
web01 ansible_host=172.31.10.1 ansible_user=ubuntu
web02 ansible_host=172.31.10.2 ansible_user=ubuntu

# ── Tier 2: Application Servers ──
[appservers]
app01 ansible_host=172.31.20.1 ansible_user=ubuntu
app02 ansible_host=172.31.20.2 ansible_user=ubuntu

# ── Tier 3: Database Servers ──
[dbservers]
db01 ansible_host=172.31.30.1 ansible_user=ubuntu

# ── Group of Groups (meta group) ──
# Lets you target all production servers at once
[production:children]
webservers
appservers
dbservers

# ── Variables that apply to ALL hosts ──
[all:vars]
ansible_python_interpreter=/usr/bin/python3
env=production
app_name=myapp
