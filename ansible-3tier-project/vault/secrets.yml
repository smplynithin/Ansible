# !! THIS FILE MUST ALWAYS BE ENCRYPTED BEFORE COMMITTING !!
#
# How to use:
#   Encrypt:   ansible-vault encrypt vault/secrets.yml
#   Decrypt:   ansible-vault decrypt vault/secrets.yml
#   Edit:      ansible-vault edit vault/secrets.yml
#   View only: ansible-vault view vault/secrets.yml
#
# Create a new vault file from scratch:
#   ansible-vault create vault/secrets.yml
#
# Run playbook with vault:
#   ansible-playbook site.yml --ask-vault-pass
#   ansible-playbook site.yml --vault-password-file ~/.vault_pass
#
# Store password in file (for CI/CD pipelines):
#   echo "MyVaultPassword123" > ~/.vault_pass
#   chmod 600 ~/.vault_pass
# ============================================================

