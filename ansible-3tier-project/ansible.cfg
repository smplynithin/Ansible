# ============================================================
# ansible.cfg — Global Configuration
# TOPIC COVERED: ansible.cfg, SSH setup, performance tuning
# ============================================================

[defaults]
# Where to find inventory (can be file or directory)
inventory           = ./inventories/hosts.ini

# Default remote user for SSH connections
remote_user         = ubuntu

# Path to your PEM key (AWS EC2 key)
private_key_file    = ~/.ssh/my-key.pem

# Don't ask "are you sure you want to connect?" for new hosts
host_key_checking   = False

# Where Ansible looks for roles
roles_path          = ./roles

# Don't save .retry files when playbook fails
retry_files_enabled = False

# Makes output much more readable (try: yaml, debug, minimal)
stdout_callback     = yaml

# How many hosts to run tasks on simultaneously (parallelism)
forks               = 10

# Where to cache gathered facts (speeds up repeated runs)
fact_caching        = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout    = 86400   # 24 hours in seconds

# Log every run to a file
log_path            = ./ansible.log

[privilege_escalation]
# Automatically become root (sudo) when needed
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
# SSH pipelining = speed boost (reduces SSH connections)
# Requires 'Defaults !requiretty' in /etc/sudoers on managed nodes
pipelining = True

# SSH connection multiplexing (reuse connections)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[inventory]
# Show warning if inventory has no hosts
unparsed_is_failed = True
