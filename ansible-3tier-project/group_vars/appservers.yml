# ============================================================
# group_vars/appservers.yml — Variables ONLY for app servers
# ============================================================
tomcat_version: "10.1.18"
tomcat_install_dir: "/opt/tomcat"
tomcat_home: "{{ tomcat_install_dir }}/apache-tomcat-{{ tomcat_version }}"

# JVM memory tuning
jvm_heap_min: "512m"
jvm_heap_max: "1024m"
jvm_gc_opts: "-XX:+UseG1GC"

# War file to deploy
war_file_name: "{{ app_name }}.war"
war_deploy_path: "{{ tomcat_home }}/webapps/"

# DB connection (app servers need to reach DB)
db_host: "172.31.30.1"
db_name: appdb
db_user: appuser
db_password: "{{ vault_db_password }}"   # ← from Vault!
